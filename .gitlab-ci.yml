image: alpine:3.15
stages:
  - build
  - test
before_script:
  - apk add --no-cache g++ make gcovr
build-job:
  stage: build
  script:
    - make all
test-job:
  stage: test
  script:
    - make test
    - gcovr --root . --exclude test/ --exclude src/l1_UserInterface.cpp --xml-pretty --output coverage.xml
    - gcovr --root . --exclude test/ --exclude src/l1_UserInterface.cpp
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
